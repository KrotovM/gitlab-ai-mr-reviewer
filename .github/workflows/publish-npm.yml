name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # v5 auto-enables pnpm cache from package.json's packageManager field,
          # but pnpm only appears after "corepack enable" below.
          package-manager-cache: false

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:ts

      - name: Debug npm identity
        run: |
          node -v
          npm -v
          npm whoami || true

      - name: Publish
        run: npm publish --access public --provenance

